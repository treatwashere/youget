<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youjet Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        widget: {
                            bg: '#0f0f0f',
                            lightBg: '#ffffff',
                            border: '#272727',
                            lightBorder: '#e5e5e5'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black text-white min-h-screen font-sans flex items-center justify-center p-6">

    <div class="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 gap-10">
        
        <!-- Setup Controls -->
        <div class="flex flex-col justify-center space-y-6">
            <div>
                <h1 class="text-3xl font-bold mb-2">Youjet Setup</h1>
                <p class="text-gray-400 text-sm">Configure your YouTube widget and grab the embed code.</p>
            </div>

            <div class="space-y-4">
                <!-- Handle Input -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">YouTube Handle / ID</label>
                    <input type="text" id="yt-handle" placeholder="@MrBeast" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-600 transition-colors">
                </div>

                <!-- Theme Selection -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Theme</label>
                    <select id="theme-select" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-600 transition-colors appearance-none">
                        <option value="dark">Dark Mode</option>
                        <option value="light">Light Mode</option>
                    </select>
                </div>

                <!-- Language Selection -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Language</label>
                    <select id="lang-select" class="w-full bg-[#1A1A1A] border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-600 transition-colors appearance-none">
                        <option value="en">English (EN)</option>
                        <option value="es">Spanish (ES)</option>
                        <option value="fr">French (FR)</option>
                        <option value="de">German (DE)</option>
                    </select>
                </div>
            </div>

            <!-- Code Snippet Output -->
            <div class="pt-4">
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Embed Code</label>
                <div class="relative">
                    <textarea id="code-snippet" readonly class="w-full bg-[#1A1A1A] border border-gray-800 rounded-lg px-4 py-3 text-gray-300 font-mono text-sm resize-none h-24 focus:outline-none"></textarea>
                    <button id="copy-btn" class="absolute top-2 right-2 bg-[#2A2A2A] hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded-md transition-colors">Copy</button>
                </div>
            </div>
        </div>

        <!-- Live Preview -->
        <div class="bg-[#000000] rounded-2xl border border-gray-900 flex flex-col items-center justify-center p-10 min-h-[400px] relative">
            <span class="absolute top-4 left-4 text-xs font-semibold text-gray-600 uppercase tracking-wider">Live Preview</span>
            
            <!-- The Widget (Matched exactly to image.png) -->
            <div id="preview-widget" class="bg-widget-bg rounded-2xl p-5 w-full max-w-[280px] shadow-2xl transition-colors duration-300">
                
                <!-- Header -->
                <div class="flex items-center gap-3 mb-5">
                    <div class="bg-[#FF0000] w-8 h-8 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <h3 id="preview-title" class="text-white font-bold text-[17px]">Channel Stats</h3>
                </div>

                <!-- Live Subs -->
                <div class="mb-5">
                    <span id="label-subs" class="text-[10px] text-gray-400 uppercase block mb-1">LIVE SUBSCRIBERS</span>
                    <p id="preview-count" class="text-white text-[32px] font-bold leading-tight">14,204</p>
                </div>

                <!-- Recent Subs -->
                <div>
                    <span id="label-recent" class="text-[10px] text-gray-400 uppercase block mb-2">RECENT PUBLIC SUBS</span>
                    <!-- Overlapping Avatars -->
                    <div class="flex -space-x-1.5 overflow-hidden">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix&backgroundColor=ffdfbf" class="inline-block h-8 w-8 rounded-full ring-2 ring-widget-bg bg-gray-800 transition-colors duration-300 avatar-ring">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka&backgroundColor=c0aede" class="inline-block h-8 w-8 rounded-full ring-2 ring-widget-bg bg-gray-800 transition-colors duration-300 avatar-ring">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sara&backgroundColor=ffdfbf" class="inline-block h-8 w-8 rounded-full ring-2 ring-widget-bg bg-gray-800 transition-colors duration-300 avatar-ring">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jack&backgroundColor=b6e3f4" class="inline-block h-8 w-8 rounded-full ring-2 ring-widget-bg bg-gray-800 transition-colors duration-300 avatar-ring">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=John&backgroundColor=c0aede" class="inline-block h-8 w-8 rounded-full ring-2 ring-widget-bg bg-gray-800 transition-colors duration-300 avatar-ring">
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        const handleInput = document.getElementById('yt-handle');
        const themeSelect = document.getElementById('theme-select');
        const langSelect = document.getElementById('lang-select');
        const codeSnippet = document.getElementById('code-snippet');
        const copyBtn = document.getElementById('copy-btn');
        
        const previewWidget = document.getElementById('preview-widget');
        const previewTitle = document.getElementById('preview-title');
        const previewCount = document.getElementById('preview-count');
        const labelSubs = document.getElementById('label-subs');
        const labelRecent = document.getElementById('label-recent');
        const avatarRings = document.querySelectorAll('.avatar-ring');

        const translations = {
            en: { title: "Channel Stats", subs: "LIVE SUBSCRIBERS", recent: "RECENT PUBLIC SUBS" },
            es: { title: "Estadísticas", subs: "SUSCRIPTORES EN VIVO", recent: "SUSCRIPTORES RECIENTES" },
            fr: { title: "Statistiques", subs: "ABONNÉS EN DIRECT", recent: "ABONNÉS RÉCENTS" },
            de: { title: "Kanalstatistiken", subs: "LIVE-ABONNENTEN", recent: "LETZTE ABONNENTEN" }
        };

        function updateSnippet() {
            const handle = handleInput.value || 'YOUR_HANDLE';
            const theme = themeSelect.value;
            const lang = langSelect.value;
            
            const snippet = \`<script src="https://cdn.jsdelivr.net/gh/treatwashere/Youjet@main/youjet.min.js" data-handle="\${handle}" data-theme="\${theme}" data-lang="\${lang}"><\\/script>\`;
            codeSnippet.value = snippet;
        }

        function updatePreview() {
            const theme = themeSelect.value;
            const lang = langSelect.value;

            if (theme === 'light') {
                previewWidget.classList.remove('bg-widget-bg');
                previewWidget.classList.add('bg-widget-lightBg', 'border', 'border-widget-lightBorder');
                previewTitle.classList.replace('text-white', 'text-black');
                previewCount.classList.replace('text-white', 'text-black');
                avatarRings.forEach(ring => {
                    ring.classList.remove('ring-widget-bg');
                    ring.classList.add('ring-widget-lightBg');
                });
            } else {
                previewWidget.classList.remove('bg-widget-lightBg', 'border', 'border-widget-lightBorder');
                previewWidget.classList.add('bg-widget-bg');
                previewTitle.classList.replace('text-black', 'text-white');
                previewCount.classList.replace('text-black', 'text-white');
                avatarRings.forEach(ring => {
                    ring.classList.remove('ring-widget-lightBg');
                    ring.classList.add('ring-widget-bg');
                });
            }

            previewTitle.innerText = translations[lang].title;
            labelSubs.innerText = translations[lang].subs;
            labelRecent.innerText = translations[lang].recent;
        }

        handleInput.addEventListener('input', updateSnippet);
        themeSelect.addEventListener('change', () => { updateSnippet(); updatePreview(); });
        langSelect.addEventListener('change', () => { updateSnippet(); updatePreview(); });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(codeSnippet.value);
            const originalText = copyBtn.innerText;
            copyBtn.innerText = 'Copied!';
            copyBtn.classList.replace('bg-[#2A2A2A]', 'bg-green-600');
            setTimeout(() => {
                copyBtn.innerText = originalText;
                copyBtn.classList.replace('bg-green-600', 'bg-[#2A2A2A]');
            }, 2000);
        });

        updateSnippet();
        updatePreview();
    </script>
</body>
</html>
